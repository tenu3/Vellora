
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Register | VELLORA</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'DM Sans', sans-serif;
    background: #fffaf7;
    color: #382b2b;
    min-height: 100vh;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 8%;
    background: white;
    box-shadow: 0 3px 15px rgba(0,0,0,0.05);
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    color: #a85d69;
    letter-spacing: 3px;
    font-weight: bold;
}

nav a {
    text-decoration: none;
    color: #382b2b;
    font-size: 14px;
    margin-left: 22px;
    transition: 0.3s;
}

nav a:hover {
    color: #a85d69;
}

/* MAIN CONTAINER */
.auth-container {
    min-height: calc(100vh - 150px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 55px 20px;
    background:
    radial-gradient(circle at 10% 20%, #f5e1df 0, transparent 30%),
    radial-gradient(circle at 90% 80%, #ead4d1 0, transparent 30%),
    #fffaf7;
}

/* AUTH CARD */
.auth-card {
    width: 100%;
    max-width: 950px;
    min-height: 570px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(75, 42, 45, 0.13);
    animation: appear 0.7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* IMAGE SIDE */
.auth-image {
    background:
    linear-gradient(rgba(45,25,30,0.35), rgba(45,25,30,0.45)),
    url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1000&q=85');

    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    color: white;
    text-align: center;
}

.auth-image h1 {
    font-family: 'Playfair Display', serif;
    font-size: 43px;
    margin-bottom: 15px;
}

.auth-image p {
    font-size: 14px;
    line-height: 1.8;
    max-width: 300px;
}

/* FORM SIDE */
.auth-content {
    padding: 55px 45px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.auth-content h2 {
    font-family: 'Playfair Display', serif;
    font-size: 35px;
    color: #a85d69;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 13px;
    color: #806f6f;
    margin-bottom: 28px;
}

/* TABS */
.tabs {
    display: flex;
    background: #f8eeeb;
    padding: 5px;
    border-radius: 7px;
    margin-bottom: 25px;
}

.tab {
    flex: 1;
    padding: 12px;
    border: none;
    background: transparent;
    color: #806f6f;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
}

.tab.active {
    background: #a85d69;
    color: white;
}

/* FORM */
.auth-form {
    display: none;
}

.auth-form.active {
    display: block;
    animation: fade 0.35s ease;
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #e5d6d2;
    border-radius: 6px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    background: #fffdfc;
    transition: 0.3s;
}

.form-group input:focus {
    border-color: #a85d69;
    box-shadow: 0 0 0 3px rgba(168,93,105,0.1);
}

/* PASSWORD */
.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #a85d69;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}

/* OPTIONS */
.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    margin: 5px 0 22px;
    gap: 10px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 6px;
}

.form-options a,
.switch-text a {
    color: #a85d69;
    text-decoration: none;
    font-weight: 600;
}

/* BUTTON */
.submit-btn {
    width: 100%;
    padding: 14px;
    background: #a85d69;
    color: white;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background: #81434e;
    transform: translateY(-2px);
}

.switch-text {
    text-align: center;
    font-size: 12px;
    color: #806f6f;
    margin-top: 22px;
}

#formMessage {
    font-size: 13px;
    text-align: center;
    margin-top: 15px;
    line-height: 1.5;
}

/* FOOTER */
footer {
    text-align: center;
    background: #382b2b;
    color: #d8c5c5;
    padding: 20px;
    font-size: 12px;
}

/* RESPONSIVE */
@media(max-width: 750px) {
    nav {
        padding: 18px 5%;
    }

    nav a {
        margin-left: 10px;
        font-size: 12px;
    }

    .auth-card {
        grid-template-columns: 1fr;
        max-width: 480px;
    }

    .auth-image {
        min-height: 230px;
    }

    .auth-image h1 {
        font-size: 34px;
    }

    .auth-content {
        padding: 35px 25px;
    }
}

@media(max-width: 420px) {
    .logo {
        font-size: 23px;
    }

    nav a {
        margin-left: 7px;
    }

    .auth-image {
        min-height: 190px;
    }

    .auth-content h2 {
        font-size: 29px;
    }

    .form-options {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="logo">VELLORA</div>

    <div>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
    </div>
</nav>

<!-- AUTH SECTION -->
<section class="auth-container">

    <div class="auth-card">

        <!-- IMAGE SIDE -->
        <div class="auth-image">
            <h1>Welcome to VELLORA</h1>
            <p>
                Discover elegance, embrace your style
                and explore fashion that speaks for you.
            </p>
        </div>

        <!-- FORM SIDE -->
        <div class="auth-content">

            <h2 id="formTitle">Welcome Back!</h2>

            <p class="subtitle" id="formSubtitle">
                Login to explore your favourite collections.
            </p>

            <!-- TABS -->
            <div class="tabs">
                <button class="tab active" id="loginTab"
                type="button" onclick="showForm('login')">
                    Login
                </button>

                <button class="tab" id="registerTab"
                type="button" onclick="showForm('register')">
                    Register
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form class="auth-form active" id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail"
                    placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-box">
                        <input type="password" id="loginPassword"
                        placeholder="Enter your password" required>

                        <button type="button" class="toggle-password"
                        onclick="togglePassword('loginPassword', this)">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" id="forgotLink">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">
                    LOGIN →
                </button>

                <p class="switch-text">
                    Don't have an account?
                    <a href="#" onclick="showForm('register'); return false;">
                        Register
                    </a>
                </p>

            </form>

            <!-- REGISTER FORM -->
            <form class="auth-form" id="registerForm">

                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName"
                    placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail"
                    placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Create Password</label>

                    <div class="password-box">
                        <input type="password" id="registerPassword"
                        placeholder="Create a password" minlength="8" required>

                        <button type="button" class="toggle-password"
                        onclick="togglePassword('registerPassword', this)">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-box">
                        <input type="password" id="confirmPassword"
                        placeholder="Confirm your password" minlength="8" required>

                        <button type="button" class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    CREATE ACCOUNT →
                </button>

                <p class="switch-text">
                    Already have an account?
                    <a href="#" onclick="showForm('login'); return false;">
                        Login
                    </a>
                </p>

            </form>

            <p id="formMessage" aria-live="polite"></p>

        </div>
    </div>

</section>

<!-- FOOTER -->
<footer>
    © 2026 VELLORA. All Rights Reserved.
</footer>

<script>

// SWITCH BETWEEN LOGIN AND REGISTER
function showForm(type) {

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const title = document.getElementById("formTitle");
    const subtitle = document.getElementById("formSubtitle");
    const message = document.getElementById("formMessage");

    message.textContent = "";

    if (type === "register") {

        loginForm.classList.remove("active");
        registerForm.classList.add("active");

        loginTab.classList.remove("active");
        registerTab.classList.add("active");

        title.textContent = "Create Account";
        subtitle.textContent =
            "Join VELLORA and discover your personal style.";

    } else {

        registerForm.classList.remove("active");
        loginForm.classList.add("active");

        registerTab.classList.remove("active");
        loginTab.classList.add("active");

        title.textContent = "Welcome Back!";
        subtitle.textContent =
            "Login to explore your favourite collections.";

    }
}

// SHOW / HIDE PASSWORD
function togglePassword(id, button) {

    const passwordInput = document.getElementById(id);

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        button.textContent = "Hide";
    } else {
        passwordInput.type = "password";
        button.textContent = "Show";
    }
}

// MESSAGE DISPLAY
const formMessage = document.getElementById("formMessage");

// REGISTER FORM
document.getElementById("registerForm").addEventListener("submit",
function(event) {

    event.preventDefault();

    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (name.length < 2) {
        formMessage.style.color = "#c0392b";
        formMessage.textContent = "Please enter your full name.";
        return;
    }

    if (password.length < 8) {
        formMessage.style.color = "#c0392b";
        formMessage.textContent =
            "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        formMessage.style.color = "#c0392b";
        formMessage.textContent = "Passwords do not match!";
        return;
    }

    // Frontend demonstration only.
    // No account or password is stored.
    formMessage.style.color = "green";
    formMessage.textContent =
        "Registration details validated! Connect a backend to create your account.";

    this.reset();

});

// LOGIN FORM
document.getElementById("loginForm").addEventListener("submit",
function(event) {

    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
        formMessage.style.color = "#c0392b";
        formMessage.textContent =
            "Please enter your email and password.";
        return;
    }

    // Frontend demonstration only.
    // Real login requires backend authentication.
    formMessage.style.color = "#a85d69";
    formMessage.textContent =
        "Login form validated! Connect a backend to verify your account.";

});

// FORGOT PASSWORD
document.getElementById("forgotLink").addEventListener("click",
function(event) {

    event.preventDefault();

    formMessage.style.color = "#a85d69";
    formMessage.textContent =
        "Password reset requires an email service or backend.";

});

</script>

</body>
</html>
